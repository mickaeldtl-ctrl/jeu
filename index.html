<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Master - Rôles Secrets</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 16px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .container { width: 100%; max-width: 420px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 28px; margin-top: 0; margin-bottom: 20px; color: #38bdf8; }
    h2 { font-size: 20px; margin-top: 0; margin-bottom: 16px; color: #f1f5f9; }
    label { display: block; text-align: left; font-size: 14px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
    select, input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    select:focus, input:focus { border-color: #38bdf8; }
    .player-controls { display: flex; gap: 10px; margin-bottom: 12px; }
    .player-controls button { padding: 8px 12px; font-size: 14px; background: #334155; }
    .player-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; max-height: 250px; overflow-y: auto; }
    .player-row { display: flex; gap: 8px; align-items: center; }
    .player-row input { margin-bottom: 0; flex: 1; }
    .btn-remove {
      width: 42px !important;
      height: 42px !important;
      padding: 0 !important;
      background: #ef4444 !important;
      color: white !important;
      border-radius: 10px !important;
      font-weight: bold !important;
      font-size: 18px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-shrink: 0 !important;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    button:active { background: #1d4ed8; transform: scale(0.98); }
    .hidden { display: none; }
    .role-box {
      background: #0284c7;
      padding: 24px 16px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.5;
      margin: 20px 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .player-highlight { font-size: 28px; font-weight: 800; color: #38bdf8; margin: 8px 0; }
    .order-badge { font-size: 14px; color: #94a3b8; margin-bottom: 16px; font-weight: 600; }
    .summary-box { background: #0f172a; padding: 16px; border-radius: 10px; border: 1px solid #334155; margin: 16px 0; font-size: 15px; text-align: left; }
    .turn-order-list { margin-top: 10px; padding-left: 20px; color: #38bdf8; font-weight: 600; }
    
    /* Timer Styles */
    .timer-card {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 14px;
      padding: 16px;
      margin: 16px 0;
    }
    .step-title { font-size: 18px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    .timer-display { font-size: 42px; font-weight: 800; color: #f59e0b; margin: 6px 0; }
    .timer-btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .timer-btn-group button { padding: 10px; font-size: 14px; background: #475569; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ÉCRAN 1 : CONFIGURATION -->
    <div id="setup-screen" class="card">
      <h1>🎲 Game Master</h1>
      
      <label for="game-select">Jeu sélectionné :</label>
      <select id="game-select">
        <option value="insider">Insider</option>
        <option value="fake">Fake Artist (avec Undercover)</option>
        <option value="linq">Linq</option>
      </select>

      <label>Joueurs (<span id="player-count">7</span>) :</label>
      <div id="player-list" class="player-list"></div>

      <div class="player-controls">
        <button type="button" onclick="addPlayer()">+ Ajouter un joueur</button>
      </div>

      <button onclick="startGame()">Lancer la manche</button>
    </div>

    <!-- ÉCRAN 2 : PASSE LE TÉLÉPHONE -->
    <div id="pass-screen" class="card hidden">
      <h2>Donne le téléphone à :</h2>
      <div class="player-highlight" id="current-player-name">Joueur 1</div>
      <div class="order-badge" id="player-order-badge">Joueur 1 / 7</div>
      <p style="color: #94a3b8; font-size: 14px;">Prends le téléphone, regarde ton rôle en cachette puis appuie sur passer !</p>
      <button onclick="revealRole()">Voir mon rôle</button>
    </div>

    <!-- ÉCRAN 3 : RÉVÉLATION DU RÔLE -->
    <div id="reveal-screen" class="card hidden">
      <h2 id="reveal-player-name">Joueur 1</h2>
      <div class="role-box" id="role-text"></div>
      <button onclick="nextPlayer()">Cacher et passer au suivant</button>
    </div>

    <!-- ÉCRAN 4 : FIN DE LA DISTRIBUTION & CHRONO -->
    <div id="end-screen" class="card hidden">
      <h2>🎉 Distribution terminée !</h2>
      <div class="summary-box" id="game-summary"></div>

      <!-- TIMER MULTI-ÉTAPES -->
      <div id="timer-container" class="timer-card hidden">
        <div class="step-title" id="step-title">Phase 1</div>
        <div class="timer-display" id="timer-clock">00:00</div>
        <div class="timer-btn-group">
          <button type="button" onclick="toggleTimer()" id="btn-timer-start">Démarrer</button>
          <button type="button" onclick="resetTimerSequence()">Réinitialiser</button>
        </div>
      </div>

      <button onclick="resetGame()" style="background: #10b981;">Nouvelle manche</button>
    </div>

  </div>

  <script>
    const WORDS = {
      insider: [
        "Un ascenseur", "Un phare", "Une brosse à dents", "Un sous-marin", 
        "Un télescope", "Un parachute", "Une montgolfière", "Un moulin à vent",
        "Un casque audio", "Une boulangerie", "Un miroir", "Un parapluie",
        "Un sablier", "Un thermos", "Un réveil", "Une friteuse"
      ],
      fake: [
        { theme: "Cuisine", word: "Fouet", undercover: "Spatule" },
        { theme: "Transport", word: "Hélicoptère", undercover: "Avion" },
        { theme: "Nourriture", word: "Sushi", undercover: "Maki" },
        { theme: "Animal", word: "Caméléon", undercover: "Lézard" },
        { theme: "Objet", word: "Télescope", undercover: "Jumelles" },
        { theme: "Lieu", word: "Volcan", undercover: "Canyon" },
        { theme: "Monuments", word: "Tour Eiffel", undercover: "Arc de Triomphe" },
        { theme: "Musique", word: "Guitare", undercover: "Basse" }
      ],
      linq: [
        "Titanic", "Avocat", "Révolution", "Pompéi", "Hollywood", "Cendrillon", 
        "Souris", "Éclair", "Casino", "Pirate", "Astronaute", "Labyrinthe"
      ]
    };

    let initialPlayers = ["Joueur 1", "Joueur 2", "Joueur 3", "Joueur 4", "Joueur 5", "Joueur 6", "Joueur 7"];
    let players = [];
    let roles = [];
    let currentIndex = 0;
    let currentGame = "";
    let currentData = {};

    let timerSteps = [];
    let currentStepIndex = 0;
    let timerInterval = null;
    let timerSeconds = 0;
    let isTimerRunning = false;

    function renderPlayerInputs() {
      const listEl = document.getElementById('player-list');
      listEl.innerHTML = '';
      
      initialPlayers.forEach((name, index) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'p-name';
        input.value = name;
        input.placeholder = `Joueur ${index + 1}`;
        input.onchange = saveCurrentPlayerNames;
        
        row.appendChild(input);

        if (initialPlayers.length > 4) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-remove';
          btn.innerText = '✕';
          btn.onclick = function() { removePlayer(index); };
          row.appendChild(btn);
        }

        listEl.appendChild(row);
      });
      document.getElementById('player-count').innerText = initialPlayers.length;
    }

    function addPlayer() {
      saveCurrentPlayerNames();
      initialPlayers.push(`Joueur ${initialPlayers.length + 1}`);
      renderPlayerInputs();
    }

    function removePlayer(index) {
      if (initialPlayers.length > 4) {
        saveCurrentPlayerNames();
        initialPlayers.splice(index, 1);
        renderPlayerInputs();
      }
    }

    function saveCurrentPlayerNames() {
      const inputs = document.querySelectorAll('.p-name');
      if (inputs.length > 0) {
        initialPlayers = Array.from(inputs).map((input, idx) => input.value.trim() || `Joueur ${idx + 1}`);
      }
    }

    function startGame() {
      saveCurrentPlayerNames();
      players = [...initialPlayers];
      currentGame = document.getElementById('game-select').value;
      
      generateRoles();
      currentIndex = 0;
      
      document.getElementById('setup-screen').classList.add('hidden');
      showPassScreen();
    }

    function generateRoles() {
      const count = players.length;
      roles = [];

      if (currentGame === 'insider') {
        const secret = WORDS.insider[Math.floor(Math.random() * WORDS.insider.length)];
        currentData = { word: secret };
        let pool = ['MJ', 'INSIDER'];
        while (pool.length < count) pool.push('CITOYEN');
        pool.sort(() => Math.random() - 0.5);

        roles = pool.map(r => {
          if (r === 'MJ') return `Tu es le <b>MAÎTRE DU JEU</b>.<br><br>Mot secret :<br><b>${secret}</b>`;
          if (r === 'INSIDER') return `Tu es l'<b>INSIDER</b>.<br><br>Mot secret :<br><b>${secret}</b>`;
          return `Tu es <b>CITOYEN</b>.<br><br>(Tu ne sais rien)`;
        });
      } 
      else if (currentGame === 'fake') {
        const item = WORDS.fake[Math.floor(Math.random() * WORDS.fake.length)];
        currentData = item;
        
        let fakeIndex = Math.floor(Math.random() * count);
        let undercoverIndex = Math.floor(Math.random() * count);
        while (undercoverIndex === fakeIndex) undercoverIndex = Math.floor(Math.random() * count);

        for (let i = 0; i < count; i++) {
          if (i === fakeIndex) {
            roles.push(`Thème : <b>${item.theme}</b><br><br>Tu es le <b>FAKE ARTIST (X)</b> !<br>(Tu n'as pas de mot)`);
          } else if (i === undercoverIndex) {
            roles.push(`Thème : <b>${item.theme}</b><br><br>Tu es l'<b>UNDERCOVER</b> !<br>Mot proche : <b>${item.undercover}</b>`);
          } else {
            roles.push(`Thème : <b>${item.theme}</b><br><br>Mot à dessiner :<br><b>${item.word}</b>`);
          }
        }
      } 
      else if (currentGame === 'linq') {
        const secret = WORDS.linq[Math.floor(Math.random() * WORDS.linq.length)];
        currentData = { word: secret };
        let spy1 = Math.floor(Math.random() * count);
        let spy2 = Math.floor(Math.random() * count);
        while (spy1 === spy2) spy2 = Math.floor(Math.random() * count);

        for (let i = 0; i < count; i++) {
          if (i === spy1 || i === spy2) {
            roles.push(`Tu es <b>ESPION</b>.<br><br>Mot secret :<br><b>${secret}</b>`);
          } else {
            roles.push(`Tu es <b>CONTRE-ESPION</b>.<br><br>(Carte neutre)`);
          }
        }
      }
    }

    function showPassScreen() {
      document.getElementById('reveal-screen').classList.add('hidden');
      document.getElementById('pass-screen').classList.remove('hidden');
      document.getElementById('current-player-name').innerText = players[currentIndex];
      document.getElementById('player-order-badge').innerText = `Tour de passage : ${currentIndex + 1} / ${players.length}`;
    }

    function revealRole() {
      document.getElementById('pass-screen').classList.add('hidden');
      document.getElementById('reveal-screen').classList.remove('hidden');
      document.getElementById('reveal-player-name').innerText = players[currentIndex];
      document.getElementById('role-text').innerHTML = roles[currentIndex];
    }

    function nextPlayer() {
      currentIndex++;
      if (currentIndex < players.length) {
        showPassScreen();
      } else {
        showEndScreen();
      }
    }

    function showEndScreen() {
      document.getElementById('reveal-screen').classList.add('hidden');
      document.getElementById('end-screen').classList.remove('hidden');
      
      let summary = "";
      const timerContainer = document.getElementById('timer-container');

      let orderHTML = "<br><b>Ordre du tour :</b><ol class='turn-order-list'>";
      players.forEach(p => orderHTML += `<li>${p}</li>`);
      orderHTML += "</ol>";

      if (currentGame === 'fake') {
        const drawTime = players.length * 20;
        summary = `Thème : <b>${currentData.theme}</b><br><small>1 Fake Artist & 1 Undercover en jeu.</small>` + orderHTML;
        
        timerSteps = [
          { name: `🎨 Dessin - Tour 1 (${players.length} × 20s)`, duration: drawTime },
          { name: `🎨 Dessin - Tour 2 (${players.length} × 20s)`, duration: drawTime },
          { name: "🗣️ Débat & Vote", duration: 60 }
        ];
        initTimerSequence();
        timerContainer.classList.remove('hidden');
      } else if (currentGame === 'insider') {
        summary = "Le MJ lance le chrono et répond par Oui / Non / Je ne sais pas." + orderHTML;
        
        timerSteps = [
          { name: "⏱️ Questions (Insider)", duration: 300 }
        ];
        initTimerSequence();
        timerContainer.classList.remove('hidden');
      } else {
        summary = "Les joueurs donnent leurs mots indices dans cet ordre :" + orderHTML;
        timerContainer.classList.add('hidden');
      }
      document.getElementById('game-summary').innerHTML = summary;
    }

    function initTimerSequence() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      currentStepIndex = 0;
      loadCurrentStep();
      document.getElementById('btn-timer-start').innerText = "Démarrer le chrono";
    }

    function loadCurrentStep() {
      const step = timerSteps[currentStepIndex];
      timerSeconds = step.duration;
      document.getElementById('step-title').innerText = step.name;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timer-clock').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById('btn-timer-start').innerText = "Reprendre";
      } else {
        isTimerRunning = true;
        document.getElementById('btn-timer-start').innerText = "Pause";
        
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            currentStepIndex++;
            if (currentStepIndex < timerSteps.length) {
              loadCurrentStep();
            } else {
              clearInterval(timerInterval);
              isTimerRunning = false;
              document.getElementById('step-title').innerText = "🏁 Fin de la partie !";
              document.getElementById('btn-timer-start').innerText = "Terminé";
              alert("⏰ Toutes les phases sont terminées !");
            }
          }
        }, 1000);
      }
    }

    function resetTimerSequence() {
      initTimerSequence();
    }

    function resetGame() {
      clearInterval(timerInterval);
      document.getElementById('end-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');
    }

    renderPlayerInputs();
  </script>
</body>
</html>

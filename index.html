<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Master - Rôles Secrets</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 16px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 28px;
      margin-top: 0;
      margin-bottom: 20px;
      color: #38bdf8;
    }
    h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 16px;
      color: #f1f5f9;
    }
    label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #38bdf8;
    }
    .player-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .player-controls button {
      padding: 8px 12px;
      font-size: 14px;
      background: #334155;
    }
    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      max-height: 250px;
      overflow-y: auto;
    }
    .player-row {
      display: flex;
      gap: 8px;
    }
    .player-row input {
      margin-bottom: 0;
    }
    .btn-remove {
      width: auto !important;
      padding: 0 14px !important;
      background: #ef4444 !important;
      border-radius: 10px !important;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      background: #1d4ed8;
      transform: scale(0.98);
    }
    .hidden { display: none; }
    .role-box {
      background: #0284c7;
      padding: 24px 16px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.5;
      margin: 20px 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .player-highlight {
      font-size: 28px;
      font-weight: 800;
      color: #38bdf8;
      margin: 12px 0 20px 0;
    }
    .summary-box {
      background: #0f172a;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      margin: 16px 0;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ÉCRAN 1 : CONFIGURATION -->
    <div id="setup-screen" class="card">
      <h1>🎲 Game Master</h1>
      
      <label for="game-select">Jeu sélectionné :</label>
      <select id="game-select">
        <option value="insider">Insider</option>
        <option value="fake">Fake Artist</option>
        <option value="linq">Linq</option>
      </select>

      <label>Joueurs (<span id="player-count">7</span>) :</label>
      <div id="player-list" class="player-list"></div>

      <div class="player-controls">
        <button type="button" onclick="addPlayer()">+ Ajouter un joueur</button>
      </div>

      <button onclick="startGame()">Lancer la manche</button>
    </div>

    <!-- ÉCRAN 2 : PASSE LE TÉLÉPHONE -->
    <div id="pass-screen" class="card hidden">
      <h2>Passe le téléphone à :</h2>
      <div class="player-highlight" id="current-player-name">Joueur 1</div>
      <p style="color: #94a3b8; font-size: 14px;">Assure-toi que les autres ne regardent pas l'écran !</p>
      <button onclick="revealRole()">Voir mon rôle</button>
    </div>

    <!-- ÉCRAN 3 : RÉVÉLATION DU RÔLE -->
    <div id="reveal-screen" class="card hidden">
      <h2 id="reveal-player-name">Joueur 1</h2>
      <div class="role-box" id="role-text"></div>
      <button onclick="nextPlayer()">Cacher et passer au suivant</button>
    </div>

    <!-- ÉCRAN 4 : FIN DE LA DISTRIBUTION -->
    <div id="end-screen" class="card hidden">
      <h2>🎉 Prêts à jouer !</h2>
      <div class="summary-box" id="game-summary"></div>
      <button onclick="resetGame()" style="background: #10b981;">Nouvelle manche</button>
    </div>

  </div>

  <script>
    const WORDS = {
      insider: [
        "Un ascenseur", "Un phare", "Une brosse à dents", "Un sous-marin", 
        "Un télescope", "Un parachute", "Une montgolfière", "Un moulin à vent",
        "Un casque audio", "Une boulangerie", "Un miroir", "Un parapluie"
      ],
      fake: [
        { theme: "Transport", word: "Hélicoptère" },
        { theme: "Nourriture", word: "Sushi" },
        { theme: "Animal", word: "Caméléon" },
        { theme: "Objet", word: "Télescope" },
        { theme: "Lieu", word: "Volcan" },
        { theme: "Monuments", word: "Tour Eiffel" },
        { theme: "Animal", word: "Autruche" }
      ],
      linq: [
        "Titanic", "Avocat", "Révolution", "Pompéi", 
        "Hollywood", "Cendrillon", "Souris", "Éclair", "Casino"
      ]
    };

    let initialPlayers = ["Joueur 1", "Joueur 2", "Joueur 3", "Joueur 4", "Joueur 5", "Joueur 6", "Joueur 7"];
    let players = [];
    let roles = [];
    let currentIndex = 0;
    let currentGame = "";
    let currentData = {};

    function renderPlayerInputs() {
      const listEl = document.getElementById('player-list');
      listEl.innerHTML = '';
      initialPlayers.forEach((name, index) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `
          <input type="text" class="p-name" value="${name}" placeholder="Nom du joueur">
          ${initialPlayers.length > 4 ? `<button type="button" class="btn-remove" onclick="removePlayer(${index})">✕</button>` : ''}
        `;
        listEl.appendChild(row);
      });
      document.getElementById('player-count').innerText = initialPlayers.length;
    }

    function addPlayer() {
      initialPlayers.push(`Joueur ${initialPlayers.length + 1}`);
      renderPlayerInputs();
    }

    function removePlayer(index) {
      if (initialPlayers.length > 4) {
        initialPlayers.splice(index, 1);
        renderPlayerInputs();
      }
    }

    function updatePlayerNamesFromDOM() {
      const inputs = document.querySelectorAll('.p-name');
      initialPlayers = Array.from(inputs).map((input, idx) => input.value.trim() || `Joueur ${idx + 1}`);
    }

    function startGame() {
      updatePlayerNamesFromDOM();
      players = [...initialPlayers];
      currentGame = document.getElementById('game-select').value;
      
      generateRoles();
      currentIndex = 0;
      
      document.getElementById('setup-screen').classList.add('hidden');
      showPassScreen();
    }

    function generateRoles() {
      const count = players.length;
      roles = [];

      if (currentGame === 'insider') {
        const secret = WORDS.insider[Math.floor(Math.random() * WORDS.insider.length)];
        currentData = { word: secret };
        let pool = ['MJ', 'INSIDER'];
        while (pool.length < count) pool.push('CITOYEN');
        pool.sort(() => Math.random() - 0.5);

        roles = pool.map(r => {
          if (r === 'MJ') return `Tu es le <b>MAÎTRE DU JEU</b>.<br><br>Mot secret :<br><b>${secret}</b>`;
          if (r === 'INSIDER') return `Tu es l'<b>INSIDER</b>.<br><br>Mot secret :<br><b>${secret}</b>`;
          return `Tu es <b>CITOYEN</b>.<br><br>(Tu ne sais rien)`;
        });
      } 
      else if (currentGame === 'fake') {
        const item = WORDS.fake[Math.floor(Math.random() * WORDS.fake.length)];
        currentData = item;
        let fakeIndex = Math.floor(Math.random() * count);

        for (let i = 0; i < count; i++) {
          if (i === fakeIndex) {
            roles.push(`Thème : <b>${item.theme}</b><br><br>Tu es le <b>FAKE ARTIST (X)</b> !`);
          } else {
            roles.push(`Thème : <b>${item.theme}</b><br><br>Mot à dessiner :<br><b>${item.word}</b>`);
          }
        }
      } 
      else if (currentGame === 'linq') {
        const secret = WORDS.linq[Math.floor(Math.random() * WORDS.linq.length)];
        currentData = { word: secret };
        let spy1 = Math.floor(Math.random() * count);
        let spy2 = Math.floor(Math.random() * count);
        while (spy1 === spy2) spy2 = Math.floor(Math.random() * count);

        for (let i = 0; i < count; i++) {
          if (i === spy1 || i === spy2) {
            roles.push(`Tu es <b>ESPION</b>.<br><br>Mot secret :<br><b>${secret}</b>`);
          } else {
            roles.push(`Tu es <b>CONTRE-ESPION</b>.<br><br>(Carte neutre)`);
          }
        }
      }
    }

    function showPassScreen() {
      document.getElementById('reveal-screen').classList.add('hidden');
      document.getElementById('pass-screen').classList.remove('hidden');
      document.getElementById('current-player-name').innerText = players[currentIndex];
    }

    function revealRole() {
      document.getElementById('pass-screen').classList.add('hidden');
      document.getElementById('reveal-screen').classList.remove('hidden');
      document.getElementById('reveal-player-name').innerText = players[currentIndex];
      document.getElementById('role-text').innerHTML = roles[currentIndex];
    }

    function nextPlayer() {
      currentIndex++;
      if (currentIndex < players.length) {
        showPassScreen();
      } else {
        showEndScreen();
      }
    }

    function showEndScreen() {
      document.getElementById('reveal-screen').classList.add('hidden');
      document.getElementById('end-screen').classList.remove('hidden');
      
      let summary = "";
      if (currentGame === 'fake') {
        summary = `Thème annoncé : <b>${currentData.theme}</b>`;
      } else if (currentGame === 'insider') {
        summary = "Tout le monde a son rôle.<br>Le Maître du Jeu lance le chrono !";
      } else {
        summary = "Les 2 Espions ont reçu le même mot.<br>Que la manche commence !";
      }
      document.getElementById('game-summary').innerHTML = summary;
    }

    function resetGame() {
      document.getElementById('end-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');
    }

    // Initialisation
    renderPlayerInputs();
  </script>
</body>
</html>
